name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight install: the suite stubs out encoders, so no torch needed.
      - name: Install test dependencies
        run: pip install pytest pillow qdrant-client
      - name: Run tests
        run: python -m pytest test_meme_search.py -v
